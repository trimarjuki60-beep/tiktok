<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <i class="fab fa-tiktok logo"></i>
            <h1>TikTok Downloader</h1>
            <p>Download video TikTok tanpa watermark secara gratis</p>
        </header>

        <main>
            <div class="input-box">
                <input type="text" id="videoUrl" placeholder="Tempel URL TikTok di sini (misal: https://vt.tiktok.com/...)">
                <button onclick="downloadVideo()"><i class="fas fa-download"></i> Unduh</button>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Memproses video...</p>
            </div>

            <div id="result" class="result-card hidden">
                <img id="thumb" src="" alt="Thumbnail">
                <h3 id="author"></h3>
                <p id="desc"></p>
                <div class="download-links">
                    <a id="downloadNoWatermark" href="#" target="_blank" class="btn btn-primary"><i class="fas fa-video"></i> Tanpa Watermark</a>
                    <a id="downloadAudio" href="#" target="_blank" class="btn btn-secondary"><i class="fas fa-music"></i> Download MP3</a>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
